name: Build Forge Mods

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mod: [shutdown-timer, cmd-log]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.1.1"

      - name: Build ${{ matrix.mod }}
        working-directory: ${{ matrix.mod }}
        run: gradle build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mod }}-forge-jar
          path: ${{ matrix.mod }}/build/libs/*.jar
